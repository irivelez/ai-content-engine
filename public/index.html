<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Content Engine</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2d3148;
    --text: #e4e6f0;
    --text2: #8b8fa3;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --hn: #ff6600;
    --rss: #00b894;
    --x: #1da1f2;
    --reddit: #ff4500;
    --tag-bg: #2d3148;
    --tag-active: #6c5ce7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  
  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  
  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .header h1 { font-size: 1.3rem; font-weight: 700; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header .meta { color: var(--text2); font-size: 0.85rem; }
  .refresh-btn { background: none; border: 1px solid var(--border); color: var(--text2); cursor: pointer; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; transition: all 0.2s; }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .refresh-btn.running { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  input[type=date] { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 6px; font-size: 0.8rem; }
  
  /* Big Picture */
  .big-picture { background: linear-gradient(135deg, #1a1035 0%, #0f1117 100%); border: 1px solid var(--accent); border-radius: 12px; padding: 24px 28px; margin-bottom: 16px; }
  .big-picture-label { font-size: 0.75rem; color: var(--accent2); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  .big-picture-text { font-size: 1.15rem; font-weight: 600; line-height: 1.6; color: #fff; }
  
  /* Data Points */
  .data-points { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .data-point { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; text-align: center; }
  .data-point .stat { font-size: 1.3rem; font-weight: 800; color: var(--accent2); margin-bottom: 4px; }
  .data-point .context { font-size: 0.78rem; color: var(--text2); line-height: 1.4; }
  
  /* TL;DR */
  .tldr { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
  .tldr h2 { font-size: 0.9rem; color: var(--accent2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .tldr ul { list-style: none; }
  .tldr li { padding: 4px 0; font-size: 0.9rem; color: var(--text); }
  .tldr li::before { content: '→ '; color: var(--accent2); font-weight: bold; }
  
  /* Tags */
  .tags-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .tag-pill { background: var(--tag-bg); border: 1px solid var(--border); color: var(--text2); padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; user-select: none; }
  .tag-pill:hover { border-color: var(--accent); }
  .tag-pill.active { background: var(--tag-active); border-color: var(--tag-active); color: #fff; }
  .tag-pill .count { opacity: 0.7; margin-left: 4px; }
  
  /* Items */
  .items { display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; transition: border-color 0.2s; }
  .item:hover { border-color: var(--accent); }
  .item-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .source-badge { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; color: #fff; flex-shrink: 0; }
  .source-badge.hackernews { background: var(--hn); }
  .source-badge.rss { background: var(--rss); }
  .source-badge.x { background: var(--x); }
  .source-badge.reddit { background: var(--reddit); }
  .item-title { font-weight: 600; font-size: 0.9rem; }
  .item-title a { color: var(--text); text-decoration: none; }
  .item-title a:hover { color: var(--accent2); }
  .relevance { color: var(--accent2); font-size: 0.75rem; font-weight: 700; margin-left: auto; flex-shrink: 0; }
  .item-meta { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--text2); }
  .item-insight { font-size: 0.82rem; color: var(--text2); margin: 4px 0; }
  .item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .item-tag { background: var(--surface2); padding: 1px 8px; border-radius: 10px; font-size: 0.7rem; color: var(--text2); }
  
  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
  .empty h2 { font-size: 1.1rem; margin-bottom: 8px; }
  
  /* Status toast */
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--accent); padding: 10px 16px; border-radius: 8px; font-size: 0.8rem; display: none; z-index: 100; }
  .toast.show { display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚡ Content Engine</h1>
    <div class="header-right">
      <span class="meta" id="dateMeta"></span>
      <input type="date" id="datePicker">
      <button class="refresh-btn" id="refreshBtn" title="Run pipeline">🔄 Refresh</button>
    </div>
  </div>
  
  <div class="big-picture" id="bigPictureSection" style="display:none">
    <div class="big-picture-label">🌊 The Big Picture</div>
    <div class="big-picture-text" id="bigPictureText"></div>
  </div>
  
  <div class="data-points" id="dataPointsSection"></div>
  
  <div class="tldr" id="tldrSection" style="display:none">
    <h2>🔑 Key Signals</h2>
    <ul id="tldrList"></ul>
  </div>
  
  <div class="tags-bar" id="tagsBar"></div>
  <div class="items" id="itemsList"></div>
  <div class="empty" id="emptyState" style="display:none">
    <h2>No data yet</h2>
    <p>Hit refresh to run the pipeline, or select a date.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let currentData = null;
let activeTag = 'all';

async function loadLatest() {
  try {
    const res = await fetch('/api/daily/latest');
    if (!res.ok) throw new Error();
    currentData = await res.json();
    render();
  } catch {
    $('emptyState').style.display = 'block';
  }
}

async function loadDate(date) {
  try {
    const res = await fetch(`/api/daily/${date}`);
    if (!res.ok) throw new Error('No data for this date');
    currentData = await res.json();
    render();
  } catch (e) {
    showToast(e.message || 'No data for this date');
  }
}

function render() {
  if (!currentData || !currentData.items) { $('emptyState').style.display = 'block'; return; }
  $('emptyState').style.display = 'none';
  
  // Header meta
  $('dateMeta').textContent = `${currentData.date} (UTC) · ${currentData.items.length} items`;
  $('datePicker').value = currentData.date;
  
  // Big Picture
  if (currentData.bigPicture) {
    $('bigPictureSection').style.display = 'block';
    $('bigPictureText').textContent = currentData.bigPicture;
  } else {
    $('bigPictureSection').style.display = 'none';
  }
  
  // Data Points
  if (currentData.dataPoints && currentData.dataPoints.length) {
    $('dataPointsSection').innerHTML = currentData.dataPoints.map(dp => `
      <div class="data-point">
        <div class="stat">${esc(dp.stat)}</div>
        <div class="context">${esc(dp.context)}</div>
      </div>
    `).join('');
  } else {
    $('dataPointsSection').innerHTML = '';
  }
  
  // TL;DR
  if (currentData.tldr && currentData.tldr.length) {
    $('tldrSection').style.display = 'block';
    $('tldrList').innerHTML = currentData.tldr.map(b => `<li>${esc(b)}</li>`).join('');
  }
  
  // Tags
  const tagCounts = {};
  tagCounts['all'] = currentData.items.length;
  currentData.items.forEach(item => {
    (item.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
  });
  $('tagsBar').innerHTML = Object.entries(tagCounts)
    .sort((a, b) => a[0] === 'all' ? -1 : b[1] - a[1])
    .map(([tag, count]) => `<span class="tag-pill${activeTag === tag ? ' active' : ''}" data-tag="${tag}">${tag}<span class="count">${count}</span></span>`)
    .join('');
  
  // Items
  const filtered = activeTag === 'all' ? currentData.items : currentData.items.filter(i => (i.tags || []).includes(activeTag));
  $('itemsList').innerHTML = filtered.map(item => `
    <div class="item">
      <div class="item-top">
        <span class="source-badge ${item.source}">${sourceName(item.source)}</span>
        <span class="item-title"><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a></span>
        <span class="relevance">${item.relevance}/10</span>
      </div>
      <div class="item-meta">${esc(item.sourceName)}${item.engagement?.likes ? ` · ${item.engagement.likes}♥` : ''}${item.engagement?.comments ? ` · ${item.engagement.comments}💬` : ''}</div>
      <div class="item-insight">${esc(item.insight)}</div>
      <div class="item-tags">${(item.tags||[]).map(t => `<span class="item-tag">${esc(t)}</span>`).join('')}</div>
    </div>
  `).join('');
}

function sourceName(s) {
  return { hackernews: 'HN', rss: 'RSS', x: 'X', reddit: 'Reddit' }[s] || s;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Events
$('tagsBar').addEventListener('click', e => {
  const pill = e.target.closest('.tag-pill');
  if (!pill) return;
  activeTag = pill.dataset.tag;
  render();
});

$('datePicker').addEventListener('change', e => {
  if (e.target.value) loadDate(e.target.value);
});

$('refreshBtn').addEventListener('click', async () => {
  $('refreshBtn').classList.add('running');
  $('refreshBtn').textContent = '⏳ Running...';
  try {
    const res = await fetch('/api/pipeline/run', { method: 'POST' });
    const data = await res.json();
    showToast(data.message || 'Pipeline started');
    // Poll status
    const poll = setInterval(async () => {
      const sr = await fetch('/api/pipeline/status');
      const st = await sr.json();
      if (st.stage === 'complete' || st.stage === 'error' || st.stage === 'idle') {
        clearInterval(poll);
        $('refreshBtn').classList.remove('running');
        $('refreshBtn').textContent = '🔄 Refresh';
        if (st.stage === 'complete') { showToast('Pipeline complete!'); loadLatest(); }
        else if (st.stage === 'error') showToast('Error: ' + st.message);
      } else {
        showToast(st.message || st.stage);
      }
    }, 3000);
  } catch (e) {
    $('refreshBtn').classList.remove('running');
    $('refreshBtn').textContent = '🔄 Refresh';
    showToast('Error: ' + e.message);
  }
});

// Init
loadLatest();
</script>
</body>
</html>
